  <path d="M302 132 C306 152 300 160 286 162" stroke="#8c1820" stroke-width="11" stroke-linecap="round" fill="none"/>
  <rect x="274" y="148" width="22" height="30" rx="2" fill="#3d4250" transform="rotate(-12 285 163)"/>
  <rect x="280" y="104" width="12" height="12" fill="#f2c5a7"/>
  <circle cx="286" cy="92" r="15" fill="#f2c5a7"/>
  <path d="M272 90 C270 72 302 70 302 88 C296 82 282 82 272 90 Z" fill="#2b2b35"/>
  <path d="M274 96 C276 112 296 112 298 96 C294 104 278 104 274 96 Z" fill="#2b2b35"/>
