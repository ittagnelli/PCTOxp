      <ellipse rx="34" ry="11" transform="rotate(60)"/>
      <ellipse rx="34" ry="11" transform="rotate(-60)"/>
    </g>
  </g>

  <!-- studente nel cerchio con lo smartphone -->
  <circle cx="102" cy="76" r="34" fill="#e3e6ee"/>
  <path d="M74 104 C78 88 90 84 102 84 C114 84 126 88 130 104 Z" fill="#b51f26"/>
  <circle cx="102" cy="66" r="12" fill="#f2c5a7"/>
  <path d="M89 63 C89 50 115 49 115 62 C110 57 96 57 89 63 Z" fill="#2b2b35"/>
  <rect x="80" y="70" width="9" height="15" rx="2" fill="#3d4250"/>

  <!-- studentessa seduta sullo sgabello con il portatile -->
  <rect x="32" y="214" width="56" height="8" rx="4" fill="#b51f26"/>
  <path d="M40 222 L32 280 M80 222 L88 280 M60 222 V280" stroke="#9aa0ad" stroke-width="3"/>
  <path d="M52 150 C40 152 36 168 38 214 H76 C78 176 74 154 62 150 Z" fill="#3d3f47"/>
  <path d="M44 210 H108 L112 262 H100 L96 222 H44 Z" fill="#4a5262"/>
  <path d="M98 262 h18 v6 h-20 z" fill="#b51f26"/>
  <circle cx="56" cy="134" r="13" fill="#f2c5a7"/>
  <path d="M42 136 C38 116 70 112 70 132 C66 124 54 122 48 130 C48 144 46 156 40 160 C38 150 40 142 42 136 Z" fill="#2b2b35"/>
  <path d="M76 178 L118 172 L112 198 L74 202 Z" fill="#c9ced8"/>
