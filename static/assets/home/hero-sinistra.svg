  <path d="M60 176 C70 186 80 190 92 192" stroke="#f2c5a7" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- studente seduto a gambe incrociate -->
  <ellipse cx="160" cy="248" rx="44" ry="11" fill="#4a5262"/>
  <path d="M140 200 C140 182 180 182 180 200 V240 H140 Z" fill="#3d3f47"/>
  <circle cx="160" cy="170" r="13" fill="#f2c5a7"/>
  <path d="M146 168 C146 152 174 152 174 166 C166 160 154 160 146 168 Z" fill="#2b2b35"/>
  <path d="M136 228 L184 228 L188 246 L132 246 Z" fill="#c9ced8"/>
  <path d="M138 214 l14 -2 M182 214 l-14 -2" stroke="#f2c5a7" stroke-width="7" stroke-linecap="round"/>
  <path d="M120 256 h14 v6 h-16z M186 256 h14 v6 h-14z" fill="#b51f26"/>

  <!-- pila di libri -->
  <rect x="210" y="236" width="34" height="8" rx="2" fill="#b51f26"/>
  <rect x="214" y="228" width="28" height="8" rx="2" fill="#4a5262"/>
  <circle cx="230" cy="220" r="7" fill="#b51f26"/>

  <!-- docente in piedi che indica -->
  <path d="M272 186 L268 272 H282 L286 196 Z M290 196 L294 272 H308 L302 186 Z" fill="#4a5262"/>
  <path d="M264 272 h20 v7 h-22z M292 272 h20 v7 h-18z" fill="#2b2b35"/>
