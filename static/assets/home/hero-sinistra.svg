<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-label="Studenti al lavoro con un docente">
  <!-- Illustrazione segnaposto: sostituibile con un'illustrazione definitiva -->
  <defs>
    <linearGradient id="blob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eceef4"/>
    </linearGradient>
  </defs>

  <!-- sfondo a macchia -->
  <path d="M40 280 C10 240 20 200 38 170 C52 140 30 110 52 82 C76 50 118 62 140 40 C166 14 214 8 246 30 C280 52 270 92 300 112 C330 134 336 180 318 214 C304 242 316 262 312 280 Z" fill="url(#blob)"/>

  <!-- rete di collegamenti -->
  <g stroke="#b51f26" stroke-width="1.4" fill="none" opacity=".75">
    <path d="M118 78 L196 58 L250 96"/>
    <path d="M118 78 L150 120 L196 58"/>
    <path d="M150 120 L230 132"/>
  </g>
  <g fill="#b51f26">
    <circle cx="196" cy="58" r="3"/><circle cx="150" cy="120" r="3"/>
    <circle cx="230" cy="132" r="3"/><circle cx="250" cy="96" r="3"/>
  </g>
  <rect x="134" y="146" width="22" height="14" rx="2" fill="#cfd3dd"/>
  <path d="M138 151h14M138 155h10" stroke="#8a8f9c" stroke-width="1.4"/>
  <rect x="150" y="38" width="12" height="12" rx="2" fill="#cfd3dd"/>

  <!-- atomo -->
  <g transform="translate(220 68)">
    <circle r="13" fill="#b51f26"/>
    <g fill="none" stroke="#8c1820" stroke-width="1.6">
